# Conda build variants configuration
# This file defines the build matrix for variants-demo

python:
  - 3.10
  - 3.11

numpy:
  - 1.24
  - 1.26

variant_name:
  - standard
  - optimized

# Pin run_exports for compatibility
pin_run_as_build:
  python:
    min_pin: x.x
    max_pin: x.x
  numpy:
    min_pin: x.x
    max_pin: x.x

# Zip together related variants so that matching entries are paired
# (e.g., python[0] with numpy[0], python[1] with numpy[1]). If you omit
# zip_keys entirely, conda-build will use the full cross-product of all
# python and numpy versions instead.
zip_keys:
  - python
  - numpy
