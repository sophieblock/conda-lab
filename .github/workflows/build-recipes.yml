name: Build Conda Recipes

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'envs/build.yml'
  pull_request:
    paths:
      - 'recipes/**'
      - 'envs/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.recipe }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]  # Apple Silicon (arm64)
        recipe: 
          - hello-python
          - hello-c
          - variants-demo
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup conda/mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          mamba-version: "*"
          channels: conda-forge
          activate-environment: conda-lab-build
          environment-file: envs/build.yml
          auto-activate-base: false
          
      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('envs/build.yml') }}
          
      - name: Display environment info
        shell: bash -l {0}
        run: |
          conda info
          conda list
          
      - name: Build recipe
        shell: bash -l {0}
        run: |
          conda build recipes/${{ matrix.recipe }}/
          
      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ matrix.recipe }}-${{ matrix.os }}
          path: ~/miniconda3/conda-bld/**/*.tar.bz2
          retention-days: 3
